[build-system]
requires      = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name            = "codemaster"
version         = "1.0.0"
requires-python = ">=3.10"
dependencies    = []

[tool.setuptools.packages.find]
where   = ["."]
include = ["core", "core.*"]

[tool.setuptools]
py-modules = ["codemaster"]

[tool.setuptools.package-data]
"*" = ["agents/*.md", "config.json"]
