name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:

# A new push to the same branch makes the in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 22.5 is the floor package.json claims; 24 is what development runs on.
        # macOS carries the system-keychain credential backend, which Linux does not.
        os: [ubuntu-latest]
        node: ['22', '24']
        include:
          - os: macos-latest
            node: '24'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  # The version in package.json must match the tag that will carry it.
  version:
    name: version is consistent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: package.json version matches bin --version
        run: |
          npm ci
          declared=$(node -p "require('./package.json').version")
          reported=$(node bin/codemaster.js --version)
          echo "package.json: $declared · bin: $reported"
          test "$declared" = "$reported"
